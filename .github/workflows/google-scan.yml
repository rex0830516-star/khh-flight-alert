name: Google Flights 主動查詢

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flight-alert
  cancel-in-progress: false

jobs:
  google:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝 fast-flights
        run: pip install "fast-flights>=2,<3"
      - name: 查詢 Google Flights
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PRICE_LIMIT: "7500"
          END_DATE: "2027-12-31"
        run: python flight_alert.py --google
      - name: 儲存結果
        run: |
          git config user.name "flight-bot"
          git config user.email "flight-bot@users.noreply.github.com"
          git add sent.json docs/results.json
          git diff --cached --quiet || git commit -m "update results (google)"
          git pull --rebase -X theirs || true
          git push
