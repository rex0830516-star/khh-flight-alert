<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KHH 週末直航特價</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1b1f24;--mute:#6b7280;--line:#e5e7eb;--accent:#0b7a5a;--chip:#eef2f6}
  @media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1a1f25;--ink:#e8eaed;--mute:#9aa3ad;--line:#2a3038;--accent:#3ccf9a;--chip:#232a32}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
  header{padding:20px 16px 8px;max-width:640px;margin:auto}
  h1{font-size:20px;margin:0 0 4px}
  .meta{color:var(--mute);font-size:13px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;padding:8px 16px;max-width:640px;margin:auto;position:sticky;top:0;background:var(--bg);z-index:1}
  .bar button,.bar select{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px}
  .bar button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  main{max-width:640px;margin:auto;padding:8px 16px 40px}
  .card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
  .top{display:flex;justify-content:space-between;align-items:baseline}
  .route{font-size:18px;font-weight:600}
  .price{font-size:20px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
  .row{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
  .tag{display:inline-block;background:var(--chip);border-radius:6px;padding:0 6px;font-size:12px;margin-left:6px;color:var(--mute)}
  .empty{text-align:center;color:var(--mute);padding:48px 0}
</style>
</head>
<body>
<header>
  <h1>KHH 週末直航特價 ✈️</h1>
  <div class="meta" id="meta">載入中…</div>
</header>
<div class="bar">
  <button data-c="" class="on">全部</button>
  <button data-c="JP">日本</button>
  <button data-c="KR">韓國</button>
  <button data-c="CN">中國</button>
  <select id="sort"><option value="price">價格低→高</option><option value="date">日期近→遠</option></select>
</div>
<main id="list"></main>
<script>
const NAMES={JP:"日本",KR:"韓國",CN:"中國"};
let data={results:[]},country="",sort="price";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
  let rows=data.results.filter(r=>!country||r.country===country);
  rows.sort(sort==="price"?(a,b)=>a.price-b.price:(a,b)=>a.dep.localeCompare(b.dep));
  const list=document.getElementById("list");
  if(!rows.length){list.innerHTML='<div class="empty">目前沒有符合條件的票</div>';return}
  list.innerHTML=rows.map(r=>`
    <a class="card" href="${esc(r.link)}" target="_blank" rel="noopener">
      <div class="top"><span class="route">KHH ⇄ ${esc(r.dest)}<span class="tag">${esc(NAMES[r.country]||r.country)}</span></span>
      <span class="price">${r.price.toLocaleString()}</span></div>
      <div class="row">去 ${esc(r.dep)}（五）· ${esc(r.flight)}</div>
      <div class="row">回 ${esc(r.ret)}（日）<span class="tag">${r.source==="google"?"Google Flights":"Aviasales"}</span></div>
    </a>`).join("");
}
document.querySelectorAll(".bar button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".bar button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");country=b.dataset.c;render();
});
document.getElementById("sort").onchange=e=>{sort=e.target.value;render()};
fetch("results.json?t="+Date.now()).then(r=>r.json()).then(d=>{
  data=d;
  document.getElementById("meta").textContent=
    `來回 < ${d.limit.toLocaleString()} ${d.currency}・共 ${d.results.length} 筆・更新於 ${d.updated}`;
  render();
}).catch(()=>{document.getElementById("meta").textContent="尚無資料，請等第一次掃描完成"});
</script>
</body>
</html>
